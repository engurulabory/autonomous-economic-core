name: deploy-aec-durable-state

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  AEC_D1_DATABASE_ID: ${{ secrets.AEC_D1_DATABASE_ID }}
  AEC_STATE_TOKEN: ${{ secrets.AEC_STATE_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate required deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID AEC_D1_DATABASE_ID AEC_STATE_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

      - name: Build credential-free Wrangler config
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          template = Path('deploy/cloudflare/wrangler.toml.example').read_text()
          value = os.environ['AEC_D1_DATABASE_ID'].strip()
          if not value or any(ch.isspace() for ch in value):
              raise SystemExit('invalid AEC_D1_DATABASE_ID')
          Path('deploy/cloudflare/wrangler.toml').write_text(
              template.replace('REPLACE_WITH_D1_DATABASE_ID', value), encoding='utf-8'
          )
          PY

      - name: Apply D1 schema
        working-directory: deploy/cloudflare
        run: npx --yes wrangler@4 d1 execute aec-durable-state --remote --file=schema.sql --config=wrangler.toml

      - name: Install runtime bearer secret
        working-directory: deploy/cloudflare
        shell: bash
        run: printf '%s' "$AEC_STATE_TOKEN" | npx --yes wrangler@4 secret put AEC_STATE_TOKEN --config=wrangler.toml

      - name: Deploy durable-state Worker
        working-directory: deploy/cloudflare
        run: npx --yes wrangler@4 deploy --config=wrangler.toml | tee ../../runtime-cloudflare-deploy.log

      - name: Publish deployment log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aec-cloudflare-deploy-${{ github.run_id }}
          path: runtime-cloudflare-deploy.log
          if-no-files-found: warn
          retention-days: 14
